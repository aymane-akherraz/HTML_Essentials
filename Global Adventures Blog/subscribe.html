<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Join Us</h1>
    <form method="POST">
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        <input class="checkbox" type="checkbox" id="subscribe" name="newsletter" required>
        <label class="checkbox" for="subscribe">I would like to receive newsletters from Global Adventures Blog</label>
        <input type="submit" value="Subscribe">
    </form>
</body>
</html>
