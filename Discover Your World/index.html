<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Discover Your World</title>
    <link rel="icon" type="image/png" href="https://edube.org/uploads/media/default/0001/04/web-favicon.png">
    <script src="script.js"></script>
</head>

<body>
    <h1>Discover Your World &#x1F30D</h1>
    <p>Click the button to learn about the continent you're on and some famous geographical features.</p>
    <button style="display: block;" id="discoverLocation">Discover Location</button>

    <img src="https://edube.org/uploads/media/default/0001/04/continents.jpg" usemap="#image-map" alt="World Map">
    <map name="image-map">
        <area shape="rect" alt="North America" title="North America" id="north-america" coords="41,17,386,283">
        <area shape="rect" alt="South America" title="South America" id="south-america" coords="209,288,358,501">
        <area shape="rect" alt="Europe" title="Europe" id="europe" coords="391,68,505,217">
        <area shape="rect" alt="Africa" title="Africa" id="africa" coords="387,217,533,448">
        <area shape="rect" alt="Asia" title="Asia" id="asia" coords="506,1,893,153">
        <area shape="rect" alt="Australia and Oceania" title="Australia and Oceania" id="australia-and-oceania"
            coords="679,353,872,480">
    </map>
</body>

</html>
