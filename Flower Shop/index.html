<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Explore a variety of indoor plants for your home or office.">
	<link rel="stylesheet" href="style.css">
	<title>Indoor Plants</title>
</head>
<body>
	<h1>Indoor Plants</h1>
	<div class="container">
		<div class="flex-item">
			<img src="https://edube.org/uploads/media/default/0001/04/spathiphyllum-peace-lily.jpg" alt="Peace Lily">
			<h2>Peace Lily</h2>
			<button onclick="toggleDescription(event)">Show Description</button>
			<p class="hidden">The Peace Lily, known for its elegant white flowers, is a popular choice for indoor spaces.</p>
			<p class="price">Price: $15</p>
		</div>
		<div class="flex-item">
			<img src="https://edube.org/uploads/media/default/0001/04/zamioculcas-zanzibar-gem.jpg" alt="Zanzibar Gem">
			<h2>Zanzibar Gem</h2>
			<button onclick="toggleDescription(event)">Show Description</button>
			<p class="hidden">The Zanzibar Gem, with its glossy green foliage, is a low-maintenance indoor plant perfect for beginners.</p>
			<p class="price">Price: $20</p>
		</div>
	</div>
	<script src="script.js"></script>
</body>
</html>
